name: Build Bharat Jan-Munshi APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev libjpeg-dev libfreetype6-dev
        python -m pip install --upgrade pip
        pip install Cython==0.29.33 virtualenv
        pip install --upgrade git+https://github.com/kivy/buildozer.git@master

    - name: Setup Android SDK directly
      run: |
        export SDK_DIR="/home/runner/.buildozer/android/platform/android-sdk"
        mkdir -p "$SDK_DIR/cmdline-tools"
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline.zip
        unzip -q cmdline.zip -d "$SDK_DIR/cmdline-tools"
        mv "$SDK_DIR/cmdline-tools/cmdline-tools" "$SDK_DIR/cmdline-tools/latest"
        rm -f cmdline.zip
        
        # Legacy tools folder create for older Buildozer routines
        mkdir -p "$SDK_DIR/tools/bin"
        cp "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "$SDK_DIR/tools/bin/"
        
        yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses || true
        "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-31" "build-tools;31.0.0"

    - name: Build APK with Buildozer
      run: |
        export ANDROID_HOME="/home/runner/.buildozer/android/platform/android-sdk"
        export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
        buildozer --warn_on_root=0 android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Bharat-Jan-Munshi-APK
        path: bin/*.apk
        
