name: Build Bharat Jan-Munshi APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev libjpeg-dev libfreetype6-dev
        python -m pip install --upgrade pip
        pip install "setuptools<65.5.0" "wheel<0.39.0"
        pip install Cython==0.29.33 virtualenv buildozer

    - name: Prepare SDK & Accept Licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-31" "build-tools;31.0.0"

    - name: Setup NDK 25b
      run: |
        mkdir -p /home/runner/android-ndk
        cd /tmp
        curl -sL https://dl.google.com/android/repository/android-ndk-r25b-linux.zip -o ndk.zip
        unzip -q ndk.zip -d /home/runner/android-ndk
        rm -f ndk.zip

    - name: Build APK with Buildozer
      run: |
        export ANDROID_NDK_HOME="/home/runner/android-ndk/android-ndk-r25b"
        export ANDROID_SDK_ROOT="$ANDROID_HOME"
        sed -i 's/^#* *android.api *=.*/android.api = 31/' buildozer.spec || true
        sed -i 's/^#* *android.minapi *=.*/android.minapi = 21/' buildozer.spec || true
        sed -i 's/^#* *android.ndk_api *=.*/android.ndk_api = 21/' buildozer.spec || true
        sed -i "s|^#* *android.ndk_path *=.*|android.ndk_path = /home/runner/android-ndk/android-ndk-r25b|" buildozer.spec || true
        sed -i "s|^#* *android.sdk_path *=.*|android.sdk_path = $ANDROID_HOME|" buildozer.spec || true
        sed -i 's/^#* *android.accept_sdk_license *=.*/android.accept_sdk_license = True/' buildozer.spec || true
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Bharat-Jan-Munshi-APK
        path: bin/*.apk
        
