name: Build Bharat Jan-Munshi APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev libjpeg-dev libfreetype6-dev
        python -m pip install --upgrade pip
        pip install "setuptools<65.5.0" "wheel<0.39.0"
        pip install Cython==0.29.33 virtualenv
        pip install buildozer

    - name: Setup Android SDK and NDK 25b
      run: |
        B_SDK="/home/runner/.buildozer/android/platform/android-sdk"
        mkdir -p "$B_SDK/cmdline-tools"
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline.zip
        unzip -q cmdline.zip -d "$B_SDK/cmdline-tools"
        mv "$B_SDK/cmdline-tools/cmdline-tools" "$B_SDK/cmdline-tools/latest"
        rm -f cmdline.zip

        # Legacy tools path for older Buildozer lookups
        mkdir -p "$B_SDK/tools/bin"
        cp -r "$B_SDK/cmdline-tools/latest/bin/"* "$B_SDK/tools/bin/"
        cp -r "$B_SDK/cmdline-tools/latest/lib" "$B_SDK/tools/" 2>/dev/null || true

        # Accept licenses and install platform tools
        yes | "$B_SDK/cmdline-tools/latest/bin/sdkmanager" --licenses || true
        "$B_SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-33" "build-tools;33.0.2"

        # Download and install NDK 25b directly
        cd /tmp
        wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
        unzip -q android-ndk-r25b-linux.zip
        mkdir -p /home/runner/.buildozer/android/platform
        rm -rf /home/runner/.buildozer/android/platform/android-ndk-r*
        mv android-ndk-r25b /home/runner/.buildozer/android/platform/android-ndk-r25b
        ln -s /home/runner/.buildozer/android/platform/android-ndk-r25b /home/runner/.buildozer/android/platform/android-ndk-r28c

    - name: Build APK with Buildozer
      run: |
        unset ANDROID_NDK_HOME
        sed -i 's/^#* *android.api *=.*/android.api = 33/' buildozer.spec || true
        sed -i 's/^#* *android.minapi *=.*/android.minapi = 21/' buildozer.spec || true
        sed -i 's/^#* *android.ndk_api *=.*/android.ndk_api = 21/' buildozer.spec || true
        sed -i 's/^#* *android.accept_sdk_license *=.*/android.accept_sdk_license = True/' buildozer.spec || true
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Bharat-Jan-Munshi-APK
        path: bin/*.apk
        
