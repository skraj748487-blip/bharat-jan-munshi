name: Build Bharat Jan-Munshi APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev libjpeg-dev libfreetype6-dev
        python -m pip install --upgrade pip
        pip install Cython==0.29.33 virtualenv
        pip install buildozer

    - name: Setup Android SDK and NDK 25b
      run: |
        TARGET_DIR="/home/runner/.buildozer/android/platform/android-sdk"
        mkdir -p "$TARGET_DIR"
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-8512546_latest.zip -O cmdline.zip
        unzip -q cmdline.zip -d "$TARGET_DIR"
        mkdir -p "$TARGET_DIR/tools/bin"
        cp -r "$TARGET_DIR/cmdline-tools/bin/"* "$TARGET_DIR/tools/bin/"
        cp -r "$TARGET_DIR/cmdline-tools/lib" "$TARGET_DIR/tools/"
        rm -f cmdline.zip
        mkdir -p "$TARGET_DIR/licenses"
        printf "89337d0c3dbbab2747d4847616d0408d47fb314a\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78ba6edcb13959c499" > "$TARGET_DIR/licenses/android-sdk-license"
        
        # Pre-install NDK 25b
        NDK_DIR="/home/runner/.buildozer/android/platform"
        mkdir -p "$NDK_DIR"
        cd /tmp
        wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
        unzip -q android-ndk-r25b-linux.zip
        mv android-ndk-r25b "$NDK_DIR/android-ndk-r25b"

    - name: Build APK with Buildozer
      run: |
        sed -i 's/^#* *android.ndk_api *=.*/android.ndk_api = 21/' buildozer.spec || true
        sed -i 's/^#* *android.api *=.*/android.api = 31/' buildozer.spec || true
        sed -i 's/^#* *android.minapi *=.*/android.minapi = 21/' buildozer.spec || true
        sed -i 's/^#* *android.ndk *=.*/android.ndk = 25b/' buildozer.spec || true
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Bharat-Jan-Munshi-APK
        path: bin/*.apk
        
