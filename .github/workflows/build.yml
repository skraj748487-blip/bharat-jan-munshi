name: Build Bharat Jan-Munshi APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev libjpeg-dev libfreetype6-dev
        python -m pip install --upgrade pip
        pip install "setuptools<65.5.0" "wheel<0.39.0"
        pip install Cython==0.29.33 virtualenv
        pip install buildozer

    - name: Configure SDK Licenses and Tools
      run: |
        mkdir -p /home/runner/.android
        touch /home/runner/.android/repositories.cfg
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-31" "build-tools;31.0.0"

    - name: Prepare Buildozer Spec & Paths
      run: |
        # NDK 25.2 का पाथ ढूंढना
        NDK_DIR=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -name "25.*" | head -n 1)
        
        # buildozer.spec में सीधे पाथ और सेटिंग्स इंजेक्ट करना
        sed -i "s|^#* *android.sdk_path *=.*|android.sdk_path = $ANDROID_HOME|" buildozer.spec || true
        sed -i "s|^#* *android.ndk_path *=.*|android.ndk_path = $NDK_DIR|" buildozer.spec || true
        sed -i "s|^#* *android.api *=.*|android.api = 31|" buildozer.spec || true
        sed -i "s|^#* *android.minapi *=.*|android.minapi = 21|" buildozer.spec || true
        sed -i "s|^#* *android.ndk_api *=.*|android.ndk_api = 21|" buildozer.spec || true
        sed -i "s|^#* *android.accept_sdk_license *=.*|android.accept_sdk_license = True|" buildozer.spec || true

    - name: Build APK with Buildozer
      run: |
        unset ANDROID_NDK_HOME
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Bharat-Jan-Munshi-APK
        path: bin/*.apk
        
