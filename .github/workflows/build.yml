name: Build Bharat Jan-Munshi APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Fix Directory Ownership & Setup Licenses
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        mkdir -p /github/home/.buildozer/android/platform/android-sdk/licenses
        printf "89337d0c3dbbab2747d4847616d0408d47fb314a\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78ba6edcb13959c499\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de79975cc3f12bc7035cc3733ceb88" > /github/home/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        printf "84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de79975cc3f12bc7035cc3733ceb88" > /github/home/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license

    - name: Build APK with Pre-accepted Licenses
      run: |
        yes | buildozer --warn_on_root=0 android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Bharat-Jan-Munshi-APK
        path: bin/*.apk
        
