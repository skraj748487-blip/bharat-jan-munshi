name: Build Bharat Jan-Munshi APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Accept Licenses & Prepare SDK
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

    - name: Install Build Tools & Fix Build Environment
      run: |
        sudo apt update
        sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
        pip install --upgrade pip
        pip install "setuptools<65.5.0" "wheel<0.39.0"
        pip install "Cython<3.0" virtualenv
        pip install python-for-android

    - name: Build APK Directly
      run: |
        export ANDROID_NDK_HOME=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
        mkdir -p bin
        p4a apk --private . \
          --package=com.bharat.janmunshi \
          --name="Bharat Jan-Munshi" \
          --version=1.0 \
          --bootstrap=webview \
          --requirements=python3,flask \
          --sdk-dir=$ANDROID_HOME \
          --ndk-dir=$ANDROID_NDK_HOME \
          --android-api=33 \
          --permission INTERNET \
          --permission RECORD_AUDIO \
          --arch=arm64-v8a

        mv *.apk bin/ || true

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Bharat-Jan-Munshi-APK
        path: bin/*.apk
