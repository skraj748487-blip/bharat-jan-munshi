name: Build Bharat Jan-Munshi APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Accept Licenses & Install Android Build Tools
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

    - name: Install Build Tools
      run: |
        sudo apt update
        sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
        pip install --upgrade pip
        pip install Cython==0.29.36 virtualenv python-for-android

    - name: Build APK Directly
      run: |
        mkdir -p bin
        p4a apk --private . \
          --package=com.bharat.janmunshi \
          --name="Bharat Jan-Munshi" \
          --version=1.0 \
          --bootstrap=webview \
          --requirements=python3,flask \
          --permission INTERNET \
          --permission RECORD_AUDIO \
          --arch=arm64-v8a \
          --local-recipes=.

        mv *.apk bin/ || true

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Bharat-Jan-Munshi-APK
        path: bin/*.apk
