name: Build Bharat Jan-Munshi APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Accept Licenses & Prepare SDK
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-31" "build-tools;31.0.0"

    - name: Install System Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev libjpeg-dev libfreetype6-dev
        python -m pip install --upgrade pip
        pip install "setuptools<65.5.0" "wheel<0.39.0"
        pip install Cython==0.29.33 virtualenv
        pip install python-for-android

    - name: Setup NDK 25b
      run: |
        cd /tmp
        wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
        unzip -q android-ndk-r25b-linux.zip
        sudo mv android-ndk-r25b /opt/android-ndk-r25b

    - name: Build APK Directly with p4a
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        P4A_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        mkdir -p bin
        p4a apk \
          --private . \
          --package=org.bharat.janmunshi \
          --name="Bharat Jan-Munshi" \
          --version=1.0 \
          --bootstrap=sdl2 \
          --requirements=python3,kivy,reportlab,qrcode \
          --sdk-dir=$ANDROID_HOME \
          --ndk-dir=/opt/android-ndk-r25b \
          --android-api=31 \
          --ndk-api=21 \
          --arch=arm64-v8a \
          --permission INTERNET

        mv *.apk bin/ || true

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Bharat-Jan-Munshi-APK
        path: bin/*.apk
        
